<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">

    <!-- Preload assets -->
    <link rel="preload" href="forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml"/>
    <link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml"/>
    <link rel="manifest" href="manifest.json"/>

    <!-- Scripts -->
    <script defer src="error_screen.bundle.js"></script>
    <script defer src="main.bundle.js"></script>

    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
        canvas { display:block; width:100%; height:100%; }
        #ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        #transition-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    </style>
</head>
<body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>

    <script>
        // Example: base path for JS bundles to reference assets
        window.ASSET_BASE = "https://cdn.jsdelivr.net/gh/Instel12/Gameroom-04-Backend@main/polytrack_assets/";

        // Optional: notify parent about resize
        function notifyResize(height){
            window.parent.postMessage({magic:'SHIC', type:'resize', height: height}, '*');
        }

        // Example: call after canvas initialized
        window.addEventListener('load', () => {
            notifyResize(document.body.scrollHeight);
        });
    </script>
</body>
</html>
